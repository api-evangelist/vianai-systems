apis:
- name: hila REST API
  description: >-
    The hila REST APIs provide CRUD operations to deploy, manage, and monitor machine-learning
    models — drift detection, explainability, model performance, alerts, data profiling,
    inference tracking, pipelines, projects, and segments. Authentication is a bearer
    access_token obtained from POST /v1/user/login. The API is served per customer
    deployment from the webservices subdomain (e.g. https://webservices.company.vianai.site),
    with interactive OpenAPI docs at /docs on that host.
  humanURL: https://docs.vian.ai/5.0-r2/apis.html
