name: Vianai Systems
description: >-
  Vianai Systems is an enterprise AI company whose hila platform delivers GenAI-based
  conversational analytics ("talk to your data") alongside a machine-learning model
  monitoring, deployment, and observability platform. The hila REST APIs and Python
  client SDK (vianops-client) let teams deploy, manage, and monitor models — covering
  drift detection, explainability, model performance, alerts, data profiling, inference
  tracking, pipelines, and segments — driven from a vianctl command-line interface.
  hila is delivered as a customer-deployed platform (per-tenant *.vianai.site) and is
  available in Google Cloud Gemini Enterprise. The company is ISO 27001 and SOC 2 compliant.
